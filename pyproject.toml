[project]
name = "backend"
version = "1.6.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi==0.135.2",
    "uvicorn[standard]==0.54.0",
    "motor==3.7.1",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "bcrypt==4.3.0",
    "python-jose[cryptography]==3.5.0",
    "kriegspiel @ git+https://github.com/Kriegspiel/ks-game.git@a6e55ca92c2543047ac7be8becf42ab2023f8b62",
    "structlog==24.2.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "python-multipart==0.0.22",
    "httpx==0.28.1",
    "pymongo==4.19.0",
    "python-chess==1.999",
]

[tool.mypy]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "black==26.10.1",
    "mypy>=1.16.1",
    "pre-commit>=4.2.0",
    "ruff==0.17.3",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires disposable MongoDB",
    "performance: performance and query-shape regression tests",
]

[tool.black]
line-length = 128
target-version = ["py315"]
include = "src/(app|tests)/.*\\.pyi?$"

[tool.ruff]
line-length = 128
src = ["src/app", "src/tests"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.coverage.run]
source = ["app"]
branch = true
